name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  caddy-apt-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install smoke-test dependencies
        run: |
          apt-get update
          apt-get install -y bash curl ca-certificates gnupg
      - name: Verify Caddy APT setup
        run: CADDY_APT_SMOKE=1 bash tests/test_caddy_apt.sh

  release:
    needs: caddy-apt-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test
        run: go test ./...
      - name: Shell syntax
        run: |
          bash -n install-proxy.sh
          bash -n merge-nodes.sh
          bash -n bootstrap-node.sh
          bash -n tests/test_caddy_apt.sh
          bash -n tests/test_install_json.sh
          bash -n tests/test_install_monitor.sh
          bash -n tests/test_install_proxyctl.sh
          bash -n tests/test_install_update.sh
          bash -n tests/test_reality_probe.sh
          bash -n tests/test_shared_guards.sh
          bash -n tests/test_bootstrap_node.sh
          bash -n tests/test_bootstrap_upgrade.sh
          bash -n tests/test_bootstrap_restore.sh
          bash -n tests/test_release_assets.sh
          bash -n tests/test_v010_flow.sh
      - name: ShellCheck
        # tests/test_caddy_apt.sh is the one existing test ShellCheck 0.9.0
        # reports findings for; it may not be edited (spec 14.6), so it is the
        # documented exemption in tests/test_release_assets.sh (SHELLCHECK_EXEMPT).
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck install-proxy.sh merge-nodes.sh bootstrap-node.sh
          shellcheck tests/test_install_json.sh tests/test_install_proxyctl.sh tests/test_install_monitor.sh tests/test_install_update.sh
          shellcheck tests/test_reality_probe.sh tests/test_shared_guards.sh tests/test_bootstrap_node.sh
          shellcheck tests/test_bootstrap_upgrade.sh tests/test_bootstrap_restore.sh
          shellcheck tests/test_release_assets.sh tests/test_v010_flow.sh
      - name: Build and validate proxyctl
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" \
            -o dist/proxyctl-linux-amd64 ./cmd/proxyctl
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" \
            -o dist/proxyctl-linux-arm64 ./cmd/proxyctl
          test "$(./dist/proxyctl-linux-amd64 version)" = "$GITHUB_REF_NAME"
          bash tests/test_install_proxyctl.sh
          bash tests/test_install_json.sh
          bash tests/test_install_monitor.sh
          bash tests/test_install_update.sh
          bash tests/test_shared_guards.sh
          bash tests/test_bootstrap_node.sh
          bash tests/test_bootstrap_upgrade.sh
          bash tests/test_bootstrap_restore.sh
          bash tests/test_caddy_apt.sh
          bash tests/test_release_assets.sh
          # Prints an explicit SKIP for the real-filesystem section (it needs
          # PROXYCTL_REAL_FS_TESTS=1, root and a throw-away host); everything
          # else in it runs.
          bash tests/test_v010_flow.sh
          cp install-proxy.sh merge-nodes.sh bootstrap-node.sh dist/
          cd dist
          sha256sum proxyctl-linux-amd64 proxyctl-linux-arm64 install-proxy.sh merge-nodes.sh bootstrap-node.sh > checksums.txt # release-checksums-command
      - name: Verify release assets in dist
        # Both binaries must print exactly the tag: the amd64 one is run
        # directly, the arm64 one (it cannot run on this runner) through
        # qemu-user. `go version -m` is no option: -trimpath drops -ldflags
        # from the recorded build settings. The five files must also match
        # checksums.txt, and the v0.9 checksum parser must find exactly one
        # entry per binary.
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          DIST_DIR=dist EXPECT_VERSION="$GITHUB_REF_NAME" bash tests/test_release_assets.sh
      - name: Verify pinned Reality runtime assets
        # --verify-assets only (network, no root/systemd needed); see
        # docs/reality-node-validation.md for what the real-runtime gates
        # in internal/realitynode need and why they don't run here.
        run: bash tests/test_reality_probe.sh --verify-assets
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/proxyctl-linux-amd64
            dist/proxyctl-linux-arm64
            dist/install-proxy.sh
            dist/merge-nodes.sh
            dist/bootstrap-node.sh
            dist/checksums.txt
