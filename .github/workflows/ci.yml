name: CI

on:
  push:
    branches: [ "main", "v0.*" ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Shell syntax
        run: |
          bash -n install-proxy.sh
          bash -n merge-nodes.sh
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: |
          shellcheck install-proxy.sh
          shellcheck merge-nodes.sh
      - name: Go fmt
        run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then echo "Go code is not formatted"; exit 1; fi
      - name: Shell tests
        run: |
          bash tests/test_install_proxyctl.sh
          bash tests/test_install_json.sh

      - name: Go test
        run: go test -v ./...
      - name: Go vet
        run: go vet ./...
